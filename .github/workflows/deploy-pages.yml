name: Deploy Guanmo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # 北京时间每周一、四 09:37，间隔 3–4 天。
    - cron: "37 1 * * 1,4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Guanmo-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars="$(gh api repos/we-used-to-be/Guanmo-open --jq '.stargazers_count')"
          if [[ ! "$stars" =~ ^[0-9]+$ ]]; then
            echo "Invalid GitHub star count"
            exit 1
          fi
          echo "NEXT_PUBLIC_GITHUB_STARS=$stars" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
